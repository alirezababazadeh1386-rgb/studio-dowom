<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استودیو فریلنس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style id="app-css">:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf7f2;--surface:#ffffff;--ink:#1c1a17;--muted:#6b665e;--line:#e8e2d8;
  --accent:#e8553d;--accent-ink:#ffffff;
  --soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --shadow:0 1px 2px rgba(28,26,23,.05),0 8px 24px rgba(28,26,23,.06);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14130f;--surface:#1d1b17;--ink:#f4efe6;--muted:#a39d91;--line:#2e2b25;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
}
:root[data-theme="dark"]{--bg:#14130f;--surface:#1d1b17;--ink:#f4efe6;--muted:#a39d91;--line:#2e2b25;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.85;font-size:16px;-webkit-font-smoothing:antialiased;min-height:100%}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3{line-height:1.4;margin:0}
p{margin:0}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.nav{display:flex;gap:6px;margin-inline-start:auto}
.nav a{padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:500;font-size:15px}
.nav a:hover{background:var(--soft);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-sm{padding:8px 16px;border-radius:12px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--accent);cursor:pointer}
.link:hover{text-decoration:underline}

/* hero */
.hero{padding:72px 0 56px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20% auto auto -10%;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--soft),transparent 65%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;position:relative}
.eyebrow{display:inline-block;background:var(--soft);color:var(--accent);font-weight:700;font-size:14px;padding:4px 14px;border-radius:999px;margin-bottom:18px}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.5px}
.lead{margin-top:18px;font-size:18px;color:var(--muted);max-width:56ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.badges{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 18px;color:var(--muted);font-size:14.5px}
.badges li::before{content:"✓";color:var(--accent);font-weight:800;margin-inline-end:6px}
.hero-art{position:relative;display:grid;gap:14px}
.mini-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.mini-card:nth-child(2){margin-inline-start:28px}
.mini-card:nth-child(3){margin-inline-start:8px}
.mini-card b{display:block;font-size:16px}
.mini-card small{color:var(--muted)}

/* sections */
.sec{padding:72px 0}
.sec.alt{background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.sec-head{margin-bottom:34px;max-width:60ch}
.sec-head h2{font-size:clamp(24px,3.4vw,34px);font-weight:800}
.sec-head p{color:var(--muted);margin-top:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.svc{padding:24px;display:flex;flex-direction:column;gap:10px}
.ico{width:52px;height:52px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:26px}
.svc h3{font-size:19px}
.svc p{color:var(--muted);font-size:15px;flex:1}
.svc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}
.price{color:var(--muted)}

/* portfolio */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;font:inherit;font-size:14.5px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.work{overflow:hidden;display:flex;flex-direction:column}
.work .thumb{aspect-ratio:16/10;width:100%;object-fit:cover;background:var(--line)}
.ph{aspect-ratio:16/10;display:grid;place-items:center;font-size:54px;font-weight:800;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 62%),hsl(calc(var(--h) + 40) 70% 46%))}
.work .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700;padding:1px 10px;border-radius:999px}
.work h3{font-size:17px}
.work p{color:var(--muted);font-size:14.5px;flex:1}
.empty{color:var(--muted);padding:30px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--radius)}

/* process */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;counter-reset:s}
.step{padding:22px;position:relative}
.step::before{counter-increment:s;content:counter(s);width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.step h3{font-size:17px;margin-bottom:4px}
.step p{color:var(--muted);font-size:15px}

/* form */
.form{padding:28px;display:grid;gap:26px;max-width:820px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px;min-width:0}
legend{font-weight:800;font-size:17px;padding:0;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:10px;text-align:start;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:14.5px;cursor:pointer;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--accent)}
.tile.on{border-color:var(--accent);background:var(--soft);font-weight:700}
.tile .t-ico{font-size:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:grid;gap:6px;font-size:14.5px;font-weight:500}
label.f>span{color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px;line-height:1.8}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
input[type=color]{padding:3px;height:44px;cursor:pointer}
.err{color:#d6322a;font-size:13.5px;font-weight:500}
.result{padding:30px;max-width:820px;display:grid;gap:16px}
.ok{width:54px;height:54px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:28px;font-weight:800}
.chan{display:flex;flex-wrap:wrap;gap:10px}
.note{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px}
.note.warn{background:rgba(214,50,42,.1);color:#d6322a}

/* faq + footer */
.faq{display:grid;gap:12px;max-width:820px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 20px}
.faq summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"＋";color:var(--accent)}
.faq details[open] summary::after{content:"－"}
.faq details p{color:var(--muted);padding-bottom:16px}
footer{border-top:1px solid var(--line);padding:36px 0 44px;color:var(--muted);font-size:14.5px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
.foot nav{display:flex;flex-wrap:wrap;gap:14px}
.foot a:hover{color:var(--accent)}

/* editor */
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.28);cursor:pointer}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);z-index:70;background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:0 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.d-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
.d-tabs button{flex:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer}
.d-tabs button.on{background:var(--ink);color:var(--bg);font-weight:700}
.d-body{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.d-foot{border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:8px}
.d-foot>div{display:flex;gap:8px}
#ed-msg{font-size:13px;color:var(--muted);min-height:20px}
.g-title{font-weight:800;font-size:15px;margin-top:8px;padding-top:12px;border-top:1px dashed var(--line)}
.g-title:first-child{margin-top:0;border:0;padding-top:0}
small.hint{color:var(--muted);font-size:12.5px;font-weight:400}
details.item{border:1px solid var(--line);border-radius:14px;padding:4px 14px;background:var(--bg)}
details.item summary{cursor:pointer;font-weight:700;padding:10px 0}
details.item[open]{display:grid;gap:12px;padding-bottom:14px}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.mini.danger{color:#d6322a;border-color:rgba(214,50,42,.4)}
.btn-add{border:1.5px dashed var(--accent);background:var(--soft);color:var(--accent);border-radius:14px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.irow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.imgprev{width:100%;max-height:150px;object-fit:cover;border-radius:10px}
.edit-banner{background:var(--ink);color:var(--bg);text-align:center;font-size:13.5px;padding:6px 10px}

@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr;gap:32px}
  .hero{padding-top:40px}
  .nav{display:none}
  .bar{justify-content:space-between}
  .row2{grid-template-columns:1fr}
  .sec{padding:52px 0}
  .mini-card:nth-child(n){margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
/* ===== shared widgets ===== */
.muted{color:var(--muted)}
.hide{display:none!important}
.badge{--c:#6b7280;display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.prog b{font-size:14px;min-width:42px;text-align:end}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);margin:20px 0 8px}
.stp{position:relative;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.5}
.stp::before{content:"";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;margin:0 auto 6px;background:var(--surface);border:2px solid var(--line);color:#fff;font-size:12px;font-weight:800;position:relative;z-index:1}
.stp::after{content:"";position:absolute;top:11px;inset-inline-start:calc(50% + 14px);inset-inline-end:calc(-50% + 14px);height:2px;background:var(--line)}
.stp:last-child::after{display:none}
.stp.done::before{content:"✓";background:var(--accent);border-color:var(--accent)}
.stp.done::after{background:var(--accent)}
.stp.cur::before{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.stp.cur,.stp.done{color:var(--ink)}
.stp.cur{font-weight:700}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0 0}
.facts div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;font-size:15px}
.timeline{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:0}
.timeline li{position:relative;padding:0 22px 16px 0;border-inline-start:0}
.timeline li::before{content:"";position:absolute;inset-inline-start:0;top:8px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline li::after{content:"";position:absolute;inset-inline-start:4px;top:20px;bottom:-2px;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline time{display:block;font-size:12.5px;color:var(--muted)}
.timeline p{white-space:pre-wrap}
.toast{position:fixed;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:12px;font-size:14.5px;box-shadow:0 8px 28px rgba(0,0,0,.3);pointer-events:auto;max-width:min(520px,calc(100% - 32px))}
.btn.danger{background:#d6322a;color:#fff}
.btn.sm{padding:7px 14px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.55;cursor:default;transform:none;filter:none}
.ltr{direction:ltr;text-align:right;unicode-bidi:plaintext}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate;letter-spacing:.06em}

/* ===== slim bar for portal/admin views ===== */
.vbar .bar{height:58px}
.vbar .sp{margin-inline-start:auto;display:flex;gap:8px;align-items:center}

/* ===== customer portal ===== */
.pwrap{padding:34px 0 64px}
.auth{max-width:520px;margin:12px auto 0;padding:28px;display:grid;gap:18px}
.auth h1{font-size:24px}
.tabs2{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs2 button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:9px 10px;border-radius:11px;cursor:pointer}
.tabs2 button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.codein{font-size:20px;text-align:center;letter-spacing:.14em;direction:ltr;text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace}
.demo-hint{font-size:13.5px}
.p-head{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.p-head h1{font-size:clamp(24px,3.5vw,32px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:30px}
.stat{padding:16px 18px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-size:24px;font-weight:800}
.p-sec{margin:34px 0 14px;font-size:20px;display:flex;align-items:center;gap:10px}
.p-sec span{font-size:13px;font-weight:700;background:var(--soft);color:var(--accent);border-radius:999px;padding:0 10px}
.ords{display:grid;gap:16px}
.ord{padding:22px}
.ord header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.ord h3{font-size:19px;margin:4px 0 2px}
.ord small{color:var(--muted)}
.ord.past{padding:16px 20px;box-shadow:none}
.ord.past h3{font-size:16px}
.latest{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:14.5px}
.latest small{display:block}
.ord details{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.ord summary{cursor:pointer;font-weight:700;padding:4px 0;color:var(--accent)}
.ord .det{white-space:pre-wrap;color:var(--muted);margin:10px 0}
.lnks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.lnks a{border:1.5px solid var(--line);border-radius:10px;padding:5px 12px;font-size:14px;font-weight:700}
.lnks a:hover{border-color:var(--accent);color:var(--accent)}
.support{padding:20px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:34px}

/* ===== admin ===== */
.adm{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:var(--bg)}
.adm-side{position:sticky;top:0;align-self:start;height:100vh;background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.adm-side .brand{padding:4px 8px 14px}
.adm-side button.t{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:start;position:relative}
.adm-side button.t:hover{background:var(--soft);color:var(--ink)}
.adm-side button.t.on{background:var(--ink);color:var(--bg);font-weight:700}
.adm-side .dot{margin-inline-start:auto;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.adm-side .grow{flex:1}
.adm-main{padding:26px clamp(16px,3vw,36px) 70px;min-width:0}
.adm-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:22px}
.adm-top h1{font-size:26px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.tools input,.tools select{width:auto;flex:1;min-width:150px;max-width:340px}
.grid-s{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{padding:16px 18px}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{font-size:26px;font-weight:800;display:block;margin-top:2px}
.kpi.warn b{color:#d6322a}
.panel{padding:20px 22px;margin-bottom:20px}
.panel h2{font-size:18px;margin-bottom:12px}
.alert{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:color-mix(in srgb,#d97706 14%,var(--surface));border:1px solid color-mix(in srgb,#d97706 45%,var(--line));border-radius:14px;padding:12px 18px;margin-bottom:20px}
.alert.ok{background:color-mix(in srgb,#16a34a 12%,var(--surface));border-color:color-mix(in srgb,#16a34a 40%,var(--line))}
.dist{display:grid;gap:10px}
.dist .r{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.dist .b{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.dist .b i{display:block;height:100%;background:var(--c,var(--accent));border-radius:999px}
.rows{display:grid;gap:10px}
.rc{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.rc:hover{border-color:var(--accent)}
.rc .main b{display:block}
.rc .main small{color:var(--muted);font-size:13px}
.rc .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:150px}
.rc .prog{width:150px}
.rc .prog b{min-width:34px;font-size:12.5px}
.chipy{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-size:12.5px;padding:0 10px;color:var(--muted)}
.chipy.red{color:#d6322a;border-color:rgba(214,50,42,.4)}
.empty2{padding:34px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.gate{max-width:560px;margin:60px auto;padding:30px;display:grid;gap:14px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.mbox{background:var(--surface);color:var(--ink);border-radius:20px;width:min(780px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mhead h2{font-size:19px}
.mbody{padding:20px 22px;display:grid;gap:16px}
.mfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.mfoot .l{display:flex;gap:10px;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.sub{font-weight:800;font-size:15px;padding-top:10px;border-top:1px dashed var(--line)}
.sub:first-child{border:0;padding-top:0}
.codebox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.codebox .kbd{font-size:20px;font-weight:700;flex:1;min-width:190px}
.ul-edit{display:grid;gap:8px}
.ul-edit .it{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ul-edit .it time{display:block;font-size:12px;color:var(--muted)}
.ul-edit .it p{white-space:pre-wrap;font-size:14.5px}
.lk{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:center}
input[type=range]{padding:0;height:34px;accent-color:var(--accent);border:0;background:transparent}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
label.chk{display:flex;gap:10px;align-items:center;font-weight:500}
.pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.9}
.hint2{font-size:13px;color:var(--muted)}
.steps-list{margin:6px 0 0;padding-inline-start:22px;color:var(--muted);font-size:14.5px;display:grid;gap:4px}

@media (max-width:820px){
  .vbar .muted{display:none}
  .vbar .brand{font-size:16px}
  .vbar .btn-sm{padding:6px 12px;font-size:13px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
  .stat{padding:12px 14px}
  .stat b{font-size:20px}
  .grid-s{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:12px 14px}
  .kpi b{font-size:22px}
  .adm-main{padding-top:18px}
  .adm-top h1{font-size:22px}
  .adm{grid-template-columns:1fr}
  .adm-side{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;border-inline-end:0;border-bottom:1px solid var(--line);align-items:center}
  .adm-side .brand,.adm-side .grow{display:none}
  .adm-side button.t{flex:none;padding:8px 14px}
  .f2,.f3{grid-template-columns:1fr}
  .rc{grid-template-columns:1fr}
  .rc .side{align-items:flex-start;flex-direction:row;flex-wrap:wrap;align-items:center}
  .dist .r{grid-template-columns:120px 1fr 28px}
  .lk{grid-template-columns:1fr}
  .stepper{font-size:11px}
}

/* ---- parse the message produced by the order form ---- */
function parseRequest(text){
  text = String(text || '');
  var labels = [['service', 'خدمت'], ['details', 'توضیحات'], ['budget', 'بودجه'], ['deadline', 'زمان تحویل'], ['name', 'نام'], ['contact', 'راه تماس']];
  var found = [];
  labels.forEach(function(l){
    var re = new RegExp('(?:^|\\n)[^\\n:]{0,4}' + l[1] + '\\s*:', 'u');
    var m = re.exec(text);
    if (m) found.push({ k: l[0], i: m.index, len: m[0].length });
  });
  found.sort(function(a, b){ return a.i - b.i; });
  var out = {};
  found.forEach(function(f, n){
    var end = n + 1 < found.length ? found[n + 1].i : text.length;
    out[f.k] = text.slice(f.i + f.len, end).trim();
  });
  if (out.contact) {
    var m2 = /^(.*?)\s*\(([^)]*)\)\s*$/.exec(out.contact);
    if (m2) { out.contact = m2[1].trim(); out.channel = m2[2].trim(); }
  }
  if (out.budget === 'مشخص نشده') out.budget = '';
  if (out.deadline === 'مشخص نشده') out.deadline = '';
  return out;
}

  var links = (o.k || []).map(function(k){
    var u = safeUrl(k.u); return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(k.l) + ' ↗</a>' : '';
  }).join('');
  return '<article class="card ord' + (past ? ' past' : '') + '">' +
    '<header><div>' + (o.s ? '<span class="tag">' + esc(o.s) + '</span>' : '') + '<h3>' + esc(o.t) + '</h3>' +

async function doLogin(){
  var btn = $('#p-btn'), er = $('#p-err');
  if (normCode(pCode).length < 6) { pErr = 'کد ورود را وارد کن.'; if (er) er.textContent = pErr; return; }
  if (btn) { btn.disabled = true; btn.textContent = 'در حال بررسی…'; }
  var rec = null;
  try { rec = await openRecord(pCode, PORTAL); } catch (e) { rec = null; }
  if (!rec) {
    pErr = portalLive() ? 'کد ورود معتبر نیست. دوباره بررسی کن یا با ما تماس بگیر.' : 'پنل مشتریان هنوز فعال نشده است.';
    if (btn) { btn.disabled = false; btn.textContent = 'ورود'; }
    if (er) er.textContent = pErr;
    return;
  }
  sess = { code: normCode(pCode), rec: rec }; pErr = '';
  try { sessionStorage.setItem('fl_code', sess.code); } catch (e) {}
  renderPortal(); window.scrollTo(0, 0);
}
async function autoLogin(){
  var c = ''; try { c = sessionStorage.getItem('fl_code') || ''; } catch (e) {}
  if (!c || sess) return;
  var rec = null; try { rec = await openRecord(c, PORTAL); } catch (e) {}
  if (rec) { sess = { code: c, rec: rec }; if (view === 'portal') renderPortal(); }
}
function logout(){
  sess = null; pCode = '';
  try { sessionStorage.removeItem('fl_code'); } catch (e) {}
  renderPortal(); window.scrollTo(0, 0);
}

function submitReg(){
  var e = {};

  if (phoneKey(REG.phone).length < 10) e.phone = 'شماره موبایل را درست وارد کن.';

document.addEventListener('input', function(e){

function loadCaps(){
  if (loadCaps.p) return loadCaps.p;
  loadCaps.p = (async function(){
    try {
      if (window.claude && window.claude.use) {
        var r = await Promise.all([claude.use('user'), claude.use('artifact'), claude.use('db'), claude.use('downloads')]);
        CAPS.user = r[0]; CAPS.artifact = r[1]; CAPS.db = r[2]; CAPS.downloads = r[3];
        if (CAPS.user) CAPS.admin = !!(await CAPS.user.canEdit());
      }
    } catch (e) {}
    CAPS.ready = true;
    isEditor = CAPS.admin && !!CAPS.artifact;
  })();
  return loadCaps.p;
}

async function admEnsure(){
  await loadCaps();
  if (!CAPS.user || !CAPS.admin) { adm.state = 'denied'; adm.why = CAPS.user ? 'notadmin' : 'nouser'; if (view === 'admin') renderAdmin(); return; }
  DB = CAPS.db;
  if (!DB) { adm.state = 'nodb'; if (view === 'admin') renderAdmin(); return; }
  if (!adm.subscribed) subscribe();
  adm.state = 'ready';
  if (view === 'admin') renderAdmin();

function dbErr(e){
  var c = e && e.code;
  toast(c === 'quota_exceeded' ? 'ظرفیت پایگاه داده پر شده است.' : c === 'invalid_argument' ? 'اجازه‌ی ذخیره نداری یا اطلاعات نامعتبر است.' : c === 'resource_exhausted' ? 'درخواست‌ها زیاد است؛ کمی صبر کن.' : 'ذخیره انجام نشد. دوباره امتحان کن.');
}
function subscribe(){
  adm.subscribed = true;
  var bad = function(e){ dbErr(e); };
  DB.collection('customers').onSnapshot(function(s){
    adm.customers = s.docs.map(function(x){ return Object.assign({ id: x.id }, x.data()); }); refreshAdm();
  }, bad);
  DB.collection('orders').onSnapshot(function(s){
    adm.orders = s.docs.map(function(x){ return Object.assign({ id: x.id }, x.data()); }); refreshAdm();
  }, bad);
  DB.doc('meta/state').onSnapshot(function(s){ adm.meta = s.exists ? s.data() : {}; refreshAdm(); }, bad);
  DB.doc('meta/settings').onSnapshot(function(s){ adm.settings = s.exists ? s.data() : {}; refreshAdm(); }, bad);
}

async function publishPortal(){
  if (adm.busy) return;
  if (!CAPS.artifact) { toast('انتشار در این نمایش ممکن نیست.'); return; }
  if ($('#app-js').textContent.indexOf('function buildDoc') < 0) { toast('انتشار در این نمایش ممکن نیست.'); return; }
  adm.busy = true;
  var btn = $('#pub-btn'), msg = function(t){ adm.pubMsg = t; var el = $('#pub-msg'); if (el) el.textContent = t; };
  if (btn) btn.disabled = true;
  try {
    var salt = PORTAL.salt ? b64d(PORTAL.salt) : crypto.getRandomValues(new Uint8Array(16));
    var act = adm.customers.filter(function(c){ return c.active !== false && c.code; }), recs = [];
    for (var i = 0; i < act.length; i++) {
      msg('در حال رمزگذاری ' + numFa(i + 1) + ' از ' + numFa(act.length) + '…');
      var c = act[i];
      var os = adm.orders.filter(function(o){ return o.cid === c.id; }).sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); }).map(publicOrder);
      recs.push(await sealRecord(c.code, salt, { name: c.name, phone: c.phone || '', orders: os }));
    }
    recs.sort(function(a, b){ return a.i < b.i ? -1 : 1; });
    var demo = adm.customers.filter(function(c){ return c.demo && c.active !== false && c.code; })[0];
    var portal = { v: 1, salt: b64e(salt), publishedAt: Date.now(), demoCode: demo ? demo.code : '', records: recs };
    msg('در حال انتشار…');
    await CAPS.artifact.publish(buildDoc(DATA, portal));
    msg('منتشر شد؛ صفحه دوباره بارگذاری می‌شود…');
  } catch (e) {
    var c2 = e && e.code;
    msg(c2 === 'conflict' ? 'نسخه‌ی جدیدتری منتشر شده بود؛ صفحه دوباره بارگذاری می‌شود.' : c2 === 'too_large' ? 'حجم اطلاعات زیاد است.' : c2 === 'rate_limited' ? 'کمی صبر کن و دوباره امتحان کن.' : 'انتشار انجام نشد (' + (c2 || 'خطا') + ').');
    adm.busy = false; if (btn) btn.disabled = false;
  }
}

function setM(path, val, isNum){
  var m = adm.modal;
  if (path[0] === '@') m[path.slice(1)] = val;
  else if (path.indexOf('newCust.') === 0) setP(m, path, val);
  else setP(m.d, path, isNum ? (parseInt(fixDigits(val).replace(/[^\d]/g, ''), 10) || 0) : val);
}

function matchService(name){
  var s = D().services.map(function(x){ return x.title; });
  name = String(name || '').trim();
  return s.indexOf(name) >= 0 ? name : (name ? name : '');
}
function applyPaste(){
  var m = adm.modal, d = m.d, p = parseRequest(m.paste);
  if (!p.service && !p.details && !p.name) { toast('این متن شبیه پیام فرم سفارش نیست.'); return; }
  d.service = matchService(p.service); if (!d.title) d.title = p.service || '';
  if (p.details) d.details = p.details;
  d.budget = p.budget || ''; d.deadlineNote = p.deadline || '';
  var contact = (p.contact || '').trim(), isMail = /@.+\./.test(contact), isPhone = phoneKey(contact).length >= 10 && !isMail;
  var key = isPhone ? phoneKey(contact) : '';
  var found = key ? adm.customers.filter(function(c){ return phoneKey(c.phone) === key; })[0] : null;
  if (found) { d.cid = found.id; }
  else if (p.name) {
    d.cid = '__new';
    m.newCust = { name: p.name, phone: isPhone ? contact : '', email: isMail ? contact : '', note: (!isPhone && !isMail && contact) ? 'راه تماس: ' + contact + (p.channel ? ' (' + p.channel + ')' : '') : '' };
  }
  renderModal(); toast('اطلاعات پر شد؛ بررسی کن و ذخیره بزن.');
}

async function saveOrder(){
  var m = adm.modal, d = m.d;
  if (m.saving) return;
  var fail = function(t){ m.err = t; renderModal(); var b = $('.mbox'); if (b) b.scrollTop = 0; };
  if (!d.cid) return fail('مشتری را انتخاب کن.');
  if (d.cid === '__new' && !String(m.newCust.name).trim()) return fail('نام مشتری جدید را وارد کن.');
  if (!String(d.title).trim()) return fail('عنوان پروژه را وارد کن.');
  var due = parseJalInput(m.dueText);
  if (due === null) return fail('موعد تحویل را به شکل ۱۴۰۵/۰۸/۲۵ وارد کن.');
  d.due = due; m.err = ''; m.saving = true; renderModal();
  try {
    if (d.cid === '__new') {
      var cref = DB.collection('customers').doc();
      await cref.set({ name: m.newCust.name.trim(), phone: m.newCust.phone.trim(), email: m.newCust.email.trim(), company: '', note: m.newCust.note.trim(), code: genCode(), active: true, createdAt: Date.now() });
      d.cid = cref.id;
    }
    if (!m.orig) d.updates.unshift({ t: d.createdAt, x: 'سفارش شما ثبت شد.', auto: true });
    else if (m.orig.status !== d.status) d.updates.push({ t: Date.now(), x: 'وضعیت پروژه به «' + stOf(d.status).l + '» تغییر کرد.', auto: true });
    var id = m.id || DB.collection('orders').doc().id, data = clone(d); delete data.id;
    await DB.doc('orders/' + id).set(data);
    await touch();
    adm.modal = null; renderModal(); toast('سفارش ذخیره شد. برای دیدن مشتری، در تب «انتشار» منتشر کن.');
  } catch (e) { m.saving = false; renderModal(); dbErr(e); }
}
async function deleteOrder(){
  var m = adm.modal;
  if (!m.confirmDel) { m.confirmDel = true; renderModal(); return; }
  try { await DB.doc('orders/' + m.id).delete(); await touch(); adm.modal = null; renderModal(); toast('سفارش حذف شد.'); } catch (e) { dbErr(e); }
}

async function saveCust(){
  var m = adm.modal, d = m.d;
  if (m.saving) return;
  if (!String(d.name).trim()) { m.err = 'نام مشتری را وارد کن.'; renderModal(); return; }
  m.saving = true; m.err = ''; renderModal();
  try {
    var id = m.id || DB.collection('customers').doc().id, data = clone(d); delete data.id;
    await DB.doc('customers/' + id).set(data); await touch();
    adm.modal = null; renderModal(); toast('مشتری ذخیره شد.');
  } catch (e) { m.saving = false; renderModal(); dbErr(e); }
}
async function deleteCust(){
  var m = adm.modal;
  if (!m.confirmDel) { m.confirmDel = true; renderModal(); return; }
  try {
    var os = adm.orders.filter(function(o){ return o.cid === m.id; });
    for (var i = 0; i < os.length; i++) await DB.doc('orders/' + os[i].id).delete();
    await DB.doc('customers/' + m.id).delete(); await touch();
    adm.modal = null; renderModal(); toast('مشتری حذف شد.');

}

async function doImport(){

  m.data.orders.forEach(function(o){ var x = clone(o), id = x.id; delete x.id; all.push(['orders/' + id, x]); });

/* ---------- events ---------- */
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.id === 'adm-q') { adm.q = t.value; var l = $('#adm-list'); if (l) l.innerHTML = admOrdersList(); return; }
  if (t.id === 'adm-cq') { adm.cq = t.value; var l2 = $('#adm-list'); if (l2) l2.innerHTML = admCustList(); return; }
  if (t.id === 'adm-sf') { adm.sf = t.value; var l3 = $('#adm-list'); if (l3) l3.innerHTML = admOrdersList(); return; }
  if (t.dataset && t.dataset.s) { adm.settings = Object.assign({}, adm.settings, (function(o){ o[t.dataset.s] = t.value; return o; })({})); return; }
  if (!adm.modal || !t.dataset || !t.dataset.m) return;
  var path = t.dataset.m, val = t.type === 'checkbox' ? t.checked : t.value, m = adm.modal;
  if (m.type === 'cust') { setP(m.d, path, val); return; }
  setM(path, val, !!t.dataset.num);
  if (t.dataset.range) { m.progTouched = true; var pv = $('#pv'); if (pv) pv.textContent = numFa(m.d.progress) + '٪'; }
  if (path === 'cid') renderModal();
  if (path === 'status') { if (!m.progTouched && stOf(val).p != null) m.d.progress = stOf(val).p; renderModal(); }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.dataset && t.dataset.import != null && t.files && t.files[0]) {
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var j = JSON.parse(fr.result);
        if (!j || j.app !== 'freelance-portal' || !Array.isArray(j.customers) || !Array.isArray(j.orders)) throw 0;
        adm.modal = { type: 'import', data: j }; renderModal();
      } catch (x) { toast('این فایل، پشتیبانِ معتبر نیست.'); }
    };
    fr.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && adm.modal && view === 'admin') closeModal(); });

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-a]'); if (!t) return;
  var a = t.dataset.a, id = t.dataset.id, v = t.dataset.v, i = +t.dataset.i, m = adm.modal;
  if (a === 'tab') { adm.tab = v; renderAdminBody(); window.scrollTo(0, 0); }
  else if (a === 'recheck') { adm.state = 'idle'; renderAdmin(); }
  else if (a === 'tosite') go('site');
  else if (a === 'editsite') { go('site'); startEdit(); }
  else if (a === 'neworder') openOrder(null);
  else if (a === 'neworderfor') { adm.modal = null; openOrder(null, { cid: id }); }
  else if (a === 'newcust') openCust(null);
  else if (a === 'openorder') { adm.modal = null; openOrder(id); }
  else if (a === 'opencust') { adm.modal = null; openCust(id); }
  else if (a === 'closem') closeModal();
  else if (a === 'parsepaste') applyPaste();
  else if (a === 'addupd') { if (m.newUpdate.trim()) { m.d.updates.push({ t: Date.now(), x: m.newUpdate.trim() }); m.newUpdate = ''; renderModal(); } }
  else if (a === 'delupd') { m.d.updates.splice(i, 1); renderModal(); }
  else if (a === 'addlink') { m.d.links.push({ l: '', u: '' }); renderModal(); }
  else if (a === 'dellink') { m.d.links.splice(i, 1); renderModal(); }
  else if (a === 'saveorder') saveOrder();
  else if (a === 'delorder') deleteOrder();
  else if (a === 'savecust') saveCust();
  else if (a === 'delcust') deleteCust();
  else if (a === 'copycode') copyText(m.d.code);
  else if (a === 'copymsg') copyText(loginMsg(m.d));
  else if (a === 'regen') { if (!m.confirmRegen) { m.confirmRegen = true; renderModal(); } else { m.d.code = genCode(); m.confirmRegen = false; renderModal(); toast('کد جدید ساخته شد؛ ذخیره و سپس منتشر کن.'); } }
  else if (a === 'publish') publishPortal();
  else if (a === 'export') exportAll();
  else if (a === 'doimport') doImport();
  else if (a === 'savesettings') {
    DB.doc('meta/settings').set({ siteUrl: String(adm.settings.siteUrl || '').trim() }).then(function(){ toast('ذخیره شد.'); }, dbErr);
  }
});

  if (edTab === 'contact') {
    return '<div class="note">سفارش‌ها و درخواست‌های ثبت‌نام با این راه‌ها برای شما ارسال می‌شود. هر کدام را خالی بگذاری، نمایش داده نمی‌شود.</div>' +
      fld('شماره واتساپ', 'contact.whatsapp', { ltr: 1, ph: '989121234567', hint: 'با کد کشور و بدون + یا صفر اول (مثلاً 989121234567)' }) +
      fld('آیدی تلگرام', 'contact.telegram', { ltr: 1, ph: 'username' }) +
      fld('ایمیل', 'contact.email', { ltr: 1, ph: 'you@example.com' }) +
      fld('اینستاگرام', 'contact.instagram', { ltr: 1, ph: 'username' }) +
      fld('شماره تلفن (نمایش در پایین سایت)', 'contact.phone', { ltr: 1 });
  }
  if (edTab === 'services') {
    return listEd('services', [
      { l: 'آیکون (یک ایموجی)', p: 'icon' }, { l: 'عنوان خدمت', p: 'title' },
      { l: 'توضیح', p: 'desc', o: { area: 1 } }, { l: 'قیمت / متن زیر کارت', p: 'price' }
    ], 'title', 'افزودن خدمت');
  }
  if (edTab === 'portfolio') {
    return listEd('portfolio', [
      { l: 'عنوان پروژه', p: 'title' }, { l: 'دسته‌بندی', p: 'category', o: { hint: 'پروژه‌های هم‌دسته با یک نام نوشته شوند تا فیلتر بسازند' } },
      { l: 'توضیح', p: 'desc', o: { area: 1 } }, { l: 'لینک پروژه (اختیاری)', p: 'link', o: { ltr: 1, ph: 'https://…' } }
    ], 'title', 'افزودن نمونه‌کار', function(it, i){
      return '<div class="irow">' + (it.image ? '<img class="imgprev" src="' + esc(it.image) + '" alt="">' : '') +
        '<label class="mini">' + (it.image ? 'تغییر تصویر' : 'انتخاب تصویر') + '<input type="file" accept="image/*" hidden data-file="' + i + '"></label>' +
        (it.image ? '<button class="mini danger" data-ed="rmimg" data-i="' + i + '">حذف تصویر</button>' : '') + '</div>';
    });
  }
  if (edTab === 'steps') return listEd('steps', [{ l: 'عنوان مرحله', p: 'title' }, { l: 'توضیح', p: 'desc', o: { area: 1 } }], 'title', 'افزودن مرحله');
  if (edTab === 'faq') return listEd('faq', [{ l: 'سوال', p: 'q' }, { l: 'پاسخ', p: 'a', o: { area: 1, rows: 4 } }], 'q', 'افزودن سوال');
  return '';
}

function renderEditor(){
  var root = $('#ed');
  if (!root) return;
  if (!isEditor || view !== 'site') { root.innerHTML = ''; return; }
  if (edState !== 'open') {
    root.innerHTML = '<button class="fab" data-ed="open">' + (draft ? '↩ ادامه ویرایش' : '✏️ ویرایش سایت') + '</button>';
    return;
  }
  var old = $('.d-body'), st = old ? old.scrollTop : 0;
  var tabs = [['general', 'عمومی'], ['contact', 'تماس'], ['services', 'خدمات'], ['portfolio', 'نمونه‌کارها'], ['steps', 'مراحل'], ['faq', 'سوالات']];
  root.innerHTML = '<aside class="drawer" role="dialog" aria-label="ویرایش سایت">' +
    '<div class="d-head"><strong>ویرایش محتوای سایت</strong><button class="mini" data-ed="min">پیش‌نمایش ▾</button></div>' +
    '<div class="d-tabs">' + tabs.map(function(t){ return '<button data-tab="' + t[0] + '" class="' + (edTab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>' +
    '<div class="d-body">' + tabBody() + '</div>' +
    '<div class="d-foot"><span id="ed-msg">' + esc(edMsg) + '</span><div><button class="btn btn-sm" data-ed="save">ذخیره و انتشار</button><button class="btn ghost btn-sm" data-ed="cancel">انصراف</button></div></div></aside>';
  var nb = $('.d-body'); if (nb) nb.scrollTop = st;
}
function setMsg(m){ edMsg = m; var el = $('#ed-msg'); if (el) el.textContent = m; }

function startEdit(){ if (!draft) draft = clone(DATA); edState = 'open'; render(); renderEditor(); }

function fileToDataURL(file, max){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function(){
      var img = new Image();
      img.onerror = rej;
      img.onload = function(){
        var r = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function saveSite(){
  if (saving) return;
  if ($('#app-js').textContent.indexOf('function buildDoc') < 0 || $('#app-css').textContent.length < 500 || !CAPS.artifact) { setMsg('ذخیره در این نمایش ممکن نیست.'); return; }
  saving = true; setMsg('در حال انتشار…');
  CAPS.artifact.publish(buildDoc(draft, PORTAL)).then(function(){
    setMsg('منتشر شد؛ صفحه دوباره بارگذاری می‌شود…');
  }, function(err){
    saving = false;
    var c = err && err.code;
    setMsg(c === 'conflict' ? 'نسخه جدیدتری منتشر شده بود؛ صفحه دوباره بارگذاری می‌شود.' :
           c === 'too_large' ? 'حجم تصاویر زیاد است؛ تصاویر کوچک‌تر یا کمتر انتخاب کن.' :
           c === 'not_writer' || c === 'not_granted' ? 'اجازه ویرایش این سایت را نداری.' :
           c === 'rate_limited' ? 'کمی صبر کن و دوباره امتحان کن.' : 'انتشار انجام نشد (' + (c || 'خطا') + ').');
  });
}

document.addEventListener('input', function(e){
  var t = e.target;
  if (!draft || !t.dataset || !t.dataset.path) return;
  var v = t.dataset.lines ? t.value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean) : t.value;
  setP(draft, t.dataset.path, v);
  schedule();
});

document.addEventListener('change', function(e){
  var t = e.target;
  if (!draft || !t.dataset || t.dataset.file == null) return;
  var i = +t.dataset.file, f = t.files && t.files[0];
  if (!f) return;
  setMsg('در حال آماده‌سازی تصویر…');
  fileToDataURL(f, 900).then(function(url){
    draft.portfolio[i].image = url; edOpen = 'portfolio' + i; setMsg(''); render(); renderEditor();
  }, function(){ setMsg('این فایل به‌عنوان تصویر خوانده نشد.'); });
});

document.addEventListener('click', function(e){
  var tb = e.target.closest('[data-tab]');
  if (tb && draft) { edTab = tb.dataset.tab; edOpen = ''; renderEditor(); return; }
  var t = e.target.closest('[data-ed]');
  if (!t) return;
  var a = t.dataset.ed, key = t.dataset.key, i = +t.dataset.i;
  if (a === 'open') startEdit();
  else if (a === 'min') { edState = 'min'; renderEditor(); }
  else if (a === 'cancel') { draft = null; edState = 'off'; edMsg = ''; render(); renderEditor(); }
  else if (a === 'save') saveSite();
  else if (a === 'add') {
    var blank = {
      services: { id: uid(), icon: '⭐', title: 'خدمت جدید', desc: '', price: '' },
      portfolio: { id: uid(), title: 'نمونه‌کار جدید', category: '', desc: '', image: '', link: '' },
      steps: { title: 'مرحله جدید', desc: '' },
      faq: { q: 'سوال جدید', a: '' }
    }[key];
    draft[key].push(blank); edOpen = key + (draft[key].length - 1); render(); renderEditor();
  } else if (a === 'del') {
    draft[key].splice(i, 1); edOpen = ''; render(); renderEditor();
  } else if (a === 'up' || a === 'down') {
    var j = a === 'up' ? i - 1 : i + 1, arr = draft[key];
    if (j >= 0 && j < arr.length) { var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; edOpen = key + j; render(); renderEditor(); }
  } else if (a === 'rmimg') {
    draft.portfolio[i].image = ''; edOpen = 'portfolio' + i; render(); renderEditor();
  }
});

/* ==== MAIN WIRING ==== */
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.closest && t.closest('[data-form]') && t.name && t.name in F) F[t.name] = t.value;
});

document.addEventListener('submit', function(e){
  if (!e.target.matches('[data-form]')) return;
  e.preventDefault();
  if (validate()) { F.result = buildMsg(D()); renderOrder(); var w = $('#order'); if (w) w.scrollIntoView({ behavior: 'smooth' }); }
  else { renderOrder(); var er = $('#order-wrap .err'); if (er) er.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
});

document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  var pt = e.target.closest('[data-pt]');
  if (pt) { pTab = pt.dataset.pt; pErr = ''; renderPortal(); return; }
  var t = e.target.closest('[data-act],[data-filter],[data-copyfirst]');
  if (!t) return;
  var txt = view === 'portal' ? REG.result : F.result;
  if (t.dataset.copyfirst && txt) { try { navigator.clipboard.writeText(txt); } catch (x) {} return; }
  if (t.dataset.filter) {
    filter = t.dataset.filter;
    $('#pgrid').innerHTML = portfolioGrid(D());
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c.dataset.filter === filter); });
    return;
  }
  var a = t.dataset.act;
  if (a === 'pick') {
    F.service = t.dataset.id; delete F.errors.service; F.result = null; renderOrder();
    if (t.dataset.scroll) { var o = $('#order'); if (o) o.scrollIntoView({ behavior: 'smooth' }); }
  } else if (a === 'copy') { copyText(txt, t); }
  else if (a === 'again') {
    F.service = ''; F.details = ''; F.budget = ''; F.deadline = ''; F.result = null; F.errors = {}; renderOrder();
  } else if (a === 'regagain') { REG = { name: '', phone: '', email: '', note: '', errors: {}, result: null }; renderPortal(); }
  else if (a === 'logout') logout();
  else if (a === 'newfromportal') {
    if (sess) { F.name = sess.rec.name || ''; F.contact = sess.rec.phone || ''; }
    F.result = null; F.errors = {};
    go('site');
    setTimeout(function(){ var o = $('#order'); if (o) o.scrollIntoView({ behavior: 'smooth' }); }, 60);
  }
});

window.addEventListener('hashchange', routeFromHash);

(function init(){
  var h = location.hash || '';
  view = h.indexOf('#/admin') === 0 ? 'admin' : h.indexOf('#/portal') === 0 ? 'portal' : 'site';
  draw(false);
  loadCaps().then(function(){
    if (CAPS.admin) { if (view === 'site') renderSite(); renderEditor(); }
  });
  autoLogin();
})();

})();</script>
